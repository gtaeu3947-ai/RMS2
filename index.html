<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-title" content="선로 약도">
<title>선로 약도</title>
<style>
:root{color-scheme:light dark;
 --bg:#F2F2F7;--card:#FFF;--label:#000;--label2:#3C3C4399;--label3:#3C3C434D;
 --fill:#7878801F;--tint:#007AFF;--red:#FF3B30;--sep:#3C3C4336;
 --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{
 --bg:#000;--card:#1C1C1E;--label:#FFF;--label2:#EBEBF599;--label3:#EBEBF54D;
 --fill:#7878805C;--tint:#0A84FF;--red:#FF453A;--sep:#54545866}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--label);font:17px/1.45 var(--sans);
 -webkit-font-smoothing:antialiased;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:340px;text-align:center}
.ic{width:62px;height:62px;margin:0 auto 20px;border-radius:15px;background:var(--tint);
 display:flex;align-items:center;justify-content:center}
.ic svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:25px;font-weight:650;letter-spacing:-.02em}
.sub{font-size:14px;color:var(--label2);margin-top:6px}
form{margin-top:26px}
input[type=password]{width:100%;font:inherit;font-size:17px;color:var(--label);background:var(--card);
 border:0;border-radius:11px;padding:13px 14px;text-align:center;-webkit-appearance:none;
 box-shadow:0 0 0 .5px var(--sep)}
input[type=password]:focus{outline:0;box-shadow:0 0 0 2px var(--tint)}
button{width:100%;margin-top:10px;font:inherit;font-size:17px;font-weight:600;color:#fff;
 background:var(--tint);border:0;border-radius:11px;padding:13px;min-height:50px;cursor:pointer;
 -webkit-tap-highlight-color:transparent}
button:disabled{opacity:.5}
label.rm{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:16px;
 font-size:14px;color:var(--label2);cursor:pointer}
label.rm input{width:19px;height:19px;accent-color:var(--tint)}
#msg{margin-top:15px;font-size:14px;line-height:1.5;min-height:20px}
#msg.err{color:var(--red)}
#msg.wait{color:var(--label2)}
.ft{margin-top:30px;font-size:12px;color:var(--label3);line-height:1.5}
</style></head>
<body>
<main>
  <div class="ic"><svg viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg></div>
  <h1>선로 약도</h1>
  <div class="sub">마산시설사업소</div>
  <form id="f">
    <input type="password" id="pw" placeholder="암호" autocomplete="current-password"
           autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button type="submit" id="go">열기</button>
    <label class="rm"><input type="checkbox" id="rm" checked>이 기기에서 기억</label>
  </form>
  <div id="msg"></div>
  <div class="ft">내용이 암호로 잠겨 있습니다.<br>암호를 아는 사람만 볼 수 있습니다.</div>
</main>

<script>
(function(){
"use strict";
var f=document.getElementById("f"), pw=document.getElementById("pw"),
    go=document.getElementById("go"), rm=document.getElementById("rm"),
    msg=document.getElementById("msg"), KEY="mst.k", DK="mst.dk";
function say(t,c){ msg.textContent=t; msg.className=c||""; }
function b2a(b){ var s="",u=new Uint8Array(b),n=0x8000;
  for(var i=0;i<u.length;i+=n) s+=String.fromCharCode.apply(null,u.subarray(i,i+n));
  return btoa(s); }
function a2b(a){ var s=atob(a), u=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
async function keyFrom(p,salt,iter){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:iter,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function unzip(u){
  if(!self.DecompressionStream) throw new Error("이 브라우저는 압축 해제를 지원하지 않습니다");
  var rs=new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip")));
  return rs.text();
}
async function open(key){
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:a2b(BOX.i)},key,a2b(BOX.d));
  var html=BOX.z ? await unzip(new Uint8Array(plain)) : new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
async function tryKey(raw){
  var key=await crypto.subtle.importKey("raw",a2b(raw),{name:"AES-GCM",length:256},true,["decrypt"]);
  await open(key);
}
f.addEventListener("submit",async function(e){
  e.preventDefault();
  if(!crypto.subtle){ say("보안 연결(https)에서 열어 주세요.","err"); return; }
  go.disabled=true; say("여는 중…","wait");
  try{
    var ks=await Promise.all([keyFrom(pw.value,a2b(BOX.s),BOX.n),
      BOX.ds?keyFrom(pw.value,a2b(BOX.ds),BOX.n):null]);
    var key=ks[0], dk=ks[1];
    await (async function(){
      var raw=await crypto.subtle.exportKey("raw",key);
      var draw=dk?b2a(await crypto.subtle.exportKey("raw",dk)):null;
      try{ if(draw) sessionStorage.setItem(DK,draw); }catch(e){}
      if(rm.checked){ try{ localStorage.setItem(KEY,b2a(raw)); if(draw) localStorage.setItem(DK,draw); }catch(e){} }
      else { try{ localStorage.removeItem(KEY); localStorage.removeItem(DK); }catch(e){} }
      await open(key);
    })();
  }catch(err){
    try{ localStorage.removeItem(KEY); localStorage.removeItem(DK); sessionStorage.removeItem(DK); }catch(e){}
    go.disabled=false; pw.value=""; pw.focus();
    say(/지원/.test(err.message)?err.message:"암호가 맞지 않습니다.","err");
  }
});
(async function(){
  var saved=null; try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(!saved||!crypto.subtle) { pw.focus(); return; }
  say("여는 중…","wait"); go.disabled=true;
  try{ var d0=localStorage.getItem(DK); if(d0) sessionStorage.setItem(DK,d0); }catch(e){}
  try{ await tryKey(saved); }
  catch(e){ try{ localStorage.removeItem(KEY); localStorage.removeItem(DK); }catch(e2){}
    go.disabled=false; say(""); pw.focus(); }
})();
})();
</script>
